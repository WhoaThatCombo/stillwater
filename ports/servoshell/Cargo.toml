[package]
name = "servoshell"
build = "build.rs"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true
repository.workspace = true
description.workspace = true

[lib]
name = "servoshell"
path = "lib.rs"
bench = false

[[bin]]
name = "servoshell"
path = "main.rs"
bench = false

[lints]
workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = { workspace = true }

[package.metadata.winresource]
FileDescription = "Stillwater"
LegalCopyright = "© The Servo Project Developers and Stillwater contributors"
OriginalFilename = "Stillwater.exe"
ProductName = "Stillwater"
ProductVersion = "0.8.6"

[features]
# Don't add new features to `default` directly. Add to `default_base` instead.
default = ["default_base", "media-gstreamer"]
# Feature groups:
# Base default features, without GStreamer media support.
default_base = [
    "bundled",
    "default_web_features",
    "default_tooling",
    "jemalloc",
    "max_log_level",
    "multiprocess",
    "js_jit",
]
# Enable jemalloc on platforms that support it (not OHOS and not Windows).
jemalloc = ["servo-allocator/use-jemalloc"]
# Sampling allocation profiler (Windows): STILLWATER_ALLOC_PROFILE=<dir>, see
# components/allocator/alloc_profile.rs.
alloc-profile = ["servo-allocator/alloc-profile"]
# Default web features should be kept in sync with the list in servo/Cargo.toml.
# We also need to enable our own features, since we also have `cfg` gated code here.
default_web_features = ["servo/default_web_features", "gamepad", "webgpu", "webgl", "webxr"]
default_tooling = ["servo/default_tooling", "devtools"]
# Bundle required resources in the binary.
bundled = ["servo/bundled"]

## Individual features below this line
baked-in-resources = ["servo/baked-in-resources"]
bundled_freetype = ["servo/bundled_freetype"]
crown = ["servo/crown"]
debugmozjs = ["servo/debugmozjs"]
devtools = ["servo/devtools"]
gamepad = ["servo/gamepad"]
jitspew = ["servo/jitspew"]
js_backtrace = ["servo/js_backtrace"]
js_jit = ["servo/js_jit"]
max_log_level = ["log/release_max_level_info"]
media-gstreamer = ["servo/media-gstreamer", "dep:gstreamer", "dep:gstreamer-app"]
multiprocess = ["servo/multiprocess"]
native-bluetooth = ["servo/native-bluetooth"]
profilemozjs = ["servo/profilemozjs"]
subtlecrypto = ["servo/subtlecrypto"]
tracing = ["dep:tracing", "dep:tracing-subscriber", "servo/tracing"]
tracing-hitrace = ["tracing", "dep:hitrace"]
tracing-perfetto = ["tracing", "dep:tracing-perfetto"]
vello = ["servo/vello"]
webgl_backtrace = ["servo/webgl_backtrace"]
webgl = ["servo/webgl"]
webgpu = ["servo/webgpu"]
webxr = ["servo/webxr"]

[dependencies]
accesskit = { workspace = true }
bpaf = { workspace = true, features = ["derive"] }
cfg-if = { workspace = true }
crossbeam-channel = { workspace = true }
dpi = { workspace = true }
euclid = { workspace = true }
flate2 = { workspace = true }
hitrace = { workspace = true, optional = true }
image = { workspace = true }
keyboard-types = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
memmap2 = { workspace = true }
mime_guess = { workspace = true }
raw-window-handle = { workspace = true }
rustls = { workspace = true, features = ["aws-lc-rs"] }
servo = { workspace = true, features = ["background_hang_monitor", "bluetooth", "testbinding"], default-features = false }
tokio = { workspace = true }
tracing = { workspace = true, optional = true }
tracing-perfetto = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true, features = ["env-filter"] }
url = { workspace = true }
webdriver_server = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = { workspace = true }
jni = { workspace = true }
# https://github.com/servo/servo/issues/32175
# By default Android enforce the tagged pointers feature, which does not work well with mozjs.
# Like Gecko, replace the system allocator with jemalloc.
servo-allocator = { workspace = true, features = ["use-jemalloc"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
backtrace = { workspace = true }

[target.'cfg(target_env = "ohos")'.dependencies]
env_filter = { workspace = true }
euclid = { workspace = true }
hilog = { workspace = true }
# force inprocess until we add multi-process support for ohos
ipc-channel = { workspace = true, features = ["force-inprocess"] }
napi-derive-ohos = { workspace = true }
napi-ohos = { workspace = true }
ohos-abilitykit-sys = { workspace = true, features = ["api-14"] }
ohos-deviceinfo = { workspace = true }
ohos-ime = { workspace = true }
ohos-ime-sys = { workspace = true }
ohos-vsync = { workspace = true }
ohos-window-sys = { workspace = true }
ohos-sys-opaque-types = { workspace = true }
ohos-window-manager-sys = { workspace = true, features = ["api-14"] }
xcomponent-sys = { workspace = true, features = ["api-20", "keyboard-types"] }

[target.'cfg(any(target_os = "android", target_env = "ohos"))'.dependencies]
nix = { workspace = true, features = ["fs"] }
serde_json = { workspace = true }
servo-base = { workspace = true }
surfman = { workspace = true, features = ["sm-angle-default"] }

[target.'cfg(not(any(target_os = "android", target_env = "ohos")))'.dependencies]
# Built-in content blocker (uBlock Origin's lists). Not "single-thread": the engine is shared
# with Servo's network threads.
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
# Decrypting passwords imported from Zen (Firefox's NSS key store) and copying them.
aes = { workspace = true }
arboard = { workspace = true }
base64 = { workspace = true }
cbc = { workspace = true }
content-security-policy = { workspace = true }
dirs = { workspace = true }
# Checking the signature on downloaded updates (already used by Servo's WebCrypto).
ed25519-dalek = { workspace = true }
egui = { workspace = true }
egui-winit = { workspace = true, features = ["accesskit", "clipboard", "wayland"] }
egui_glow = { workspace = true, features = ["winit"] }
gilrs = { workspace = true }
glow = { workspace = true }
# "Copy GIF" decodes videos with the media backend's GStreamer.
gstreamer = { workspace = true, optional = true }
gstreamer-app = { workspace = true, optional = true }
headers = { workspace = true }
itertools = { workspace = true }
pbkdf2 = { workspace = true }
rfd = { workspace = true }
rusqlite = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
stillwater-translate = { path = "../translate" }
whatlang = "0.16"
# Compare with Edge talks to a hidden Edge over the DevTools protocol (a WebSocket).
tungstenite = { workspace = true }
# For optional feature servo-allocator/use-jemalloc and servo-allocator/allocation-tracking
servo-allocator = { workspace = true }
surfman = { workspace = true, features = ["sm-x11"] }
winit = { workspace = true }

[target.'cfg(any(all(target_os = "linux", not(target_env = "ohos")), target_os = "macos"))'.dependencies]
signal-hook-registry = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
servo = { workspace = true, features = ["no-wgl"] }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = { workspace = true }
objc2-app-kit = { workspace = true, features = [
    "std",
    "NSColorSpace",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { workspace = true, features = [
    "std",
] }
