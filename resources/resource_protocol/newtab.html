<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <link rel="stylesheet" href="resource:///newtab.css" />
  </head>
  <body>
    <main>
      <img src="resource:///stillwater-icon.png" alt="" draggable="false" />
      <form action="https://duckduckgo.com/html/">
        <input name="q" aria-label="Search the web" autocomplete="off" />
        <span class="placeholder" aria-hidden="true">Search the web</span>
      </form>
    </main>
    <footer>
      <a href="https://github.com/WhoaThatCombo/stillwater">Stillwater</a>, powered by
      <a href="https://servo.org">Servo</a>
    </footer>
    <script src="servo:search-engine.js"></script>
    <script>
      // Placeholder overlay (Servo can select an empty field's placeholder text).
      const form = document.querySelector("form");
      const input = form.querySelector("input");
      const sync = () => form.classList.toggle("has-value", input.value.length > 0);
      input.addEventListener("input", sync);
      sync();
      // Enter searches (there's no button).
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && input.value.trim()) {
          event.preventDefault();
          // Search with the engine chosen in Stillwater's settings (falls back to the form).
          const template = window.STILLWATER_SEARCH;
          if (template) {
            location.href = template.replace("%s", encodeURIComponent(input.value.trim()));
          } else {
            form.submit();
          }
        }
      });
    </script>
  </body>
</html>
