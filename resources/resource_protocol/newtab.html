<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>
    <link rel="stylesheet" href="resource:///newtab.css" />
  </head>
  <body>
    <main>
      <!-- The mark, drawn here rather than as the icon image so its disc follows the theme. -->
      <div class="logo">
        <svg class="on-light" viewBox="0 0 88 88" width="88" height="88" fill="none" stroke-linecap="round" aria-hidden="true">
          <path d="M22 38 C29 26 37 26 44 38 S59 50 66 38" stroke="#6473ff" stroke-width="7" />
          <path d="M32 54 C36.5 49 40.5 49 45 54 S53.5 59 58 54" stroke="#a3b1ba" stroke-width="3" />
        </svg>
        <svg class="on-dark" viewBox="0 0 88 88" width="88" height="88" fill="none" stroke-linecap="round" aria-hidden="true">
          <path d="M22 38 C29 26 37 26 44 38 S59 50 66 38" stroke="#6473ff" stroke-width="7" />
          <path d="M32 54 C36.5 49 40.5 49 45 54 S53.5 59 58 54" stroke="#6f8591" stroke-width="3" />
        </svg>
      </div>
      <form action="https://duckduckgo.com/">
        <input name="q" aria-label="Search the web" autocomplete="off" />
        <span class="placeholder" aria-hidden="true">Search the web</span>
      </form>
    </main>
    <footer>
      <a href="https://github.com/WhoaThatCombo/stillwater">Stillwater</a>, powered by
      <a href="https://servo.org">Servo</a>
    </footer>
    <script src="servo:search-engine.js"></script>
    <script>
      // Placeholder overlay (Servo can select an empty field's placeholder text).
      const form = document.querySelector("form");
      const input = form.querySelector("input");
      const sync = () => form.classList.toggle("has-value", input.value.length > 0);
      input.addEventListener("input", sync);
      sync();
      // Enter searches (there's no button).
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && input.value.trim()) {
          event.preventDefault();
          // Search with the engine chosen in Stillwater's settings (falls back to the form).
          const template = window.STILLWATER_SEARCH;
          if (template) {
            location.href = template.replace("%s", encodeURIComponent(input.value.trim()));
          } else {
            form.submit();
          }
        }
      });
    </script>
  </body>
</html>
