<html>
<head>
  <meta charset="utf-8">
  <title>Sidebar</title>
  <link rel="stylesheet" href="servo:sidebar/zen-sidebar.css">
</head>
<body>
  <header id="toolbar" data-drag>
    <button id="compact" class="icon" title="Toggle compact mode (Ctrl+Alt+C)">&#xE89F;</button>
    <button id="back" class="icon" title="Back">&#xE72B;</button>
    <button id="forward" class="icon" title="Forward">&#xE72A;</button>
    <button id="reload" class="icon" title="Reload">&#xE72C;</button>
    <span class="spacer" data-drag></span>
    <span id="caption" hidden>
      <button id="win-min" class="icon caption" title="Minimise">&#xE921;</button>
      <button id="win-max" class="icon caption" title="Maximise">&#xE922;</button>
      <button id="win-close" class="icon caption close" title="Close">&#xE8BB;</button>
    </span>
  </header>

  <div id="urlbar">
    <span class="icon urlbar-icon">&#xE721;</span>
    <span class="field">
      <input id="url" type="text" spellcheck="false" autocomplete="off" aria-label="Search or enter address">
      <span class="placeholder" aria-hidden="true">Search or enter address</span>
    </span>
  </div>

  <div id="workspace-header">
    <button id="ws-icon" class="icon ws-icon" title="Change icon"></button>
    <button id="ws-name" title="Double-click to rename"></button>
    <input id="ws-name-input" type="text" spellcheck="false" autocomplete="off" hidden>
    <span class="spacer"></span>
    <button id="ws-color" class="ws-color" title="Change colour"></button>
    <button id="ws-delete" class="icon" title="Delete space">&#xE74D;</button>
  </div>

  <main id="tabs"></main>

  <button id="new-tab" class="tab new-tab">
    <span class="icon tab-icon">&#xE710;</span>
    <span class="tab-label">New Tab</span>
  </button>

  <button id="update" class="update-pill" hidden></button>
  <p id="update-error" class="hint update-error" hidden></p>

  <footer id="footer">
    <button id="settings-button" class="icon footer-button" title="Settings">&#xE713;</button>
    <div id="workspaces"></div>
  </footer>

  <section id="settings" hidden aria-label="Settings">
    <header class="settings-header">
      <button id="settings-close" class="icon" title="Back">&#xE72B;</button>
      <h2>Settings</h2>
    </header>

    <div class="setting-group">
      <h3>Appearance</h3>
      <div class="segmented" id="theme-choice" role="group" aria-label="Appearance">
        <button data-theme="system">System</button>
        <button data-theme="light">Light</button>
        <button data-theme="dark">Dark</button>
      </div>
    </div>

    <div class="setting-group">
      <h3>Search engine</h3>
      <div class="options" id="search-choice" role="group" aria-label="Search engine"></div>
    </div>

    <div class="setting-group">
      <h3>Sidebar</h3>
      <button class="toggle-row" id="compact-toggle">
        <span>Compact mode</span>
        <span class="switch" aria-hidden="true"></span>
      </button>
      <p class="hint">Ctrl+Alt+C also toggles it. Touch the window's left edge to show the sidebar.</p>
    </div>

    <div class="setting-group">
      <h3>Updates</h3>
      <p id="version-line"></p>
      <button id="check-updates" class="secondary">Check for updates</button>
      <p id="update-check" class="hint"></p>
    </div>
  </section>

  <script src="servo:sidebar/sidebar.js"></script>
</body>
</html>
