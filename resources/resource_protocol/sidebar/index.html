<html>
<head>
  <meta charset="utf-8">
  <title>Sidebar</title>
  <link rel="stylesheet" href="servo:sidebar/zen-sidebar.css">
  <link rel="stylesheet" href="servo:sidebar/session.css">
  <link rel="stylesheet" href="servo:sidebar/history.css">
  <link rel="stylesheet" href="servo:sidebar/downloads.css">
  <link rel="stylesheet" href="servo:sidebar/media.css">
</head>
<body>
  <!-- Zen's top row: menu and sidebar toggle on the left, navigation on the right.
       The window buttons live in the hover-reveal top bar over the page. -->
  <header id="toolbar" data-drag>
    <button id="main-menu" class="icon" title="Menu">&#xE700;</button>
    <button id="compact" class="icon" title="Toggle compact mode (Ctrl+Alt+C)">&#xE89F;</button>
    <span id="incognito-badge" title="Incognito: history, cookies, site data and form entries from this window aren't saved" data-drag hidden><span class="icon" aria-hidden="true">&#xE72E;</span>Incognito</span>
    <span class="spacer" data-drag></span>
    <button id="back" class="icon" title="Back">&#xE72B;</button>
    <button id="forward" class="icon" title="Forward">&#xE72A;</button>
    <button id="reload" class="icon" title="Reload">&#xE72C;</button>
  </header>

  <div id="urlbar">
    <span class="icon urlbar-icon">&#xE721;</span>
    <span class="field">
      <input id="url" type="text" spellcheck="false" autocomplete="off" aria-label="Search or enter address">
      <span class="placeholder" aria-hidden="true">Search or enter address</span>
    </span>
    <button id="star" class="icon" title="Bookmark this page (Ctrl+D)" hidden>&#xE734;</button>
    <button id="key" class="icon" title="Saved passwords for this site" hidden>&#xE8D7;</button>
    <button id="translate" class="icon" title="Translate this page" hidden>&#xF2B7;</button>
    <button id="shield" class="icon" title="Ad blocking" hidden><span class="shield-glyph">&#xEA18;</span><span id="shield-count"></span></button>
  </div>
  <!-- Address bar suggestions (history.js). -->
  <div id="suggestions" role="listbox" aria-label="Suggestions" hidden></div>
  <!-- Name or remove the bookmark for the current page (the star, Ctrl+D). -->
  <section id="bm-editor" class="offer-card" hidden aria-label="Bookmark">
    <p id="bm-editor-title" class="offer-title">Bookmark added</p>
    <input id="bm-editor-name" class="bm-name-input" type="text" spellcheck="false" autocomplete="off" aria-label="Bookmark name">
    <div class="offer-buttons">
      <button id="bm-editor-done" class="primary">Done</button>
      <button id="bm-editor-remove" class="secondary">Remove</button>
    </div>
  </section>

  <!-- Essentials: favicon tiles shared by every space. -->
  <div id="essentials"></div>

  <div id="workspace-header">
    <button id="ws-icon" class="icon ws-icon" title="Change icon"></button>
    <button id="ws-name" title="Double-click to rename"></button>
    <input id="ws-name-input" type="text" spellcheck="false" autocomplete="off" hidden>
    <span class="spacer"></span>
    <button id="ws-new-folder" class="icon" title="New folder">&#xE8F4;</button>
    <button id="ws-color" class="ws-color" title="Change colour"></button>
    <button id="ws-delete" class="icon" title="Delete space">&#xE74D;</button>
  </div>

  <main id="tab-area">
    <!-- This space's pinned tabs and folders. -->
    <div id="pinned"></div>
    <div id="pinned-separator" class="separator"></div>

    <button id="new-tab" class="tab new-tab">
      <span class="icon tab-icon">&#xE710;</span>
      <span class="tab-label">New Tab</span>
    </button>

    <div id="tabs"></div>
  </main>

  <!-- Tab menu (right-click a tab, or its "…" button). -->
  <div id="menu" role="menu" hidden></div>

  <button id="update" class="update-pill" hidden></button>
  <p id="update-error" class="hint update-error" hidden></p>

  <!-- Compare with Edge: progress, or why it couldn't run. -->
  <p id="compare-status" class="hint compare-status" hidden aria-live="polite"></p>

  <!-- Offered after signing in with a password that isn't saved. -->
  <section id="pw-offer" class="offer-card" hidden aria-label="Save password" aria-live="polite">
    <p id="pw-offer-title" class="offer-title"></p>
    <p id="pw-offer-user" class="hint offer-user"></p>
    <div class="offer-buttons">
      <button id="pw-offer-save" class="primary">Save</button>
      <button id="pw-offer-never" class="secondary" title="Never offer to save passwords for this site">Never</button>
      <button id="pw-offer-dismiss" class="secondary">Not now</button>
    </div>
  </section>

  <footer id="footer">
    <button id="dl-button" class="footer-button" title="Downloads"><span class="dl-ring" aria-hidden="true"></span><span class="icon dl-glyph">&#xE896;</span><span id="dl-count" class="dl-count" hidden></span></button>
    <div id="workspaces"></div>
  </footer>


  <section id="passwords" class="panel" hidden aria-label="Saved passwords">
    <header class="settings-header">
      <button id="passwords-close" class="icon" title="Back">&#xE72B;</button>
      <h2>Saved passwords</h2>
    </header>
    <div class="search-field">
      <span class="icon">&#xE721;</span>
      <span class="field">
        <input id="passwords-search" type="text" spellcheck="false" autocomplete="off" aria-label="Search saved passwords">
        <span class="placeholder" aria-hidden="true">Search</span>
      </span>
    </div>
    <p id="passwords-problem" class="hint update-error" hidden></p>
    <div id="passwords-list" class="login-list"></div>
    <p id="passwords-empty" class="hint" hidden></p>
    <div class="setting-group" id="never-group" hidden>
      <h3>Never saved for</h3>
      <div id="never-list" class="login-list"></div>
    </div>
  </section>

  <section id="history" class="panel" hidden aria-label="History and bookmarks">
    <header class="settings-header">
      <button id="history-close" class="icon" title="Back">&#xE72B;</button>
      <h2 id="history-heading">History</h2>
    </header>
    <div class="segmented" id="history-views" role="group" aria-label="Show">
      <button data-view="history">History</button>
      <button data-view="bookmarks">Bookmarks</button>
    </div>
    <div class="search-field">
      <span class="icon">&#xE721;</span>
      <span class="field">
        <input id="history-search" type="text" spellcheck="false" autocomplete="off" aria-label="Search">
        <span class="placeholder" id="history-search-placeholder" aria-hidden="true">Search history</span>
      </span>
    </div>
    <div id="history-list" class="hist-list"></div>
    <p id="history-empty" class="hint" hidden></p>
    <button id="history-more" class="secondary" hidden>Show more</button>
    <div class="setting-group hist-clear" id="history-clear-group">
      <button id="history-clear" class="secondary">Clear browsing history…</button>
      <div id="clear-options" hidden>
        <h3>Clear history from</h3>
        <div class="segmented" id="clear-range" role="group" aria-label="Clear history from">
          <button data-range="hour">Last hour</button>
          <button data-range="today">Today</button>
          <button data-range="all">Everything</button>
        </div>
        <button class="toggle-row tall" id="clear-site-data" aria-pressed="false">
          <span><span>Also clear cookies and site data</span><span class="row-detail">For every site and all time, not only this range. Signs you out of websites.</span></span>
          <span class="switch" aria-hidden="true"></span>
        </button>
        <div class="offer-buttons">
          <button id="clear-confirm" class="primary">Clear</button>
          <button id="clear-cancel" class="secondary">Cancel</button>
        </div>
      </div>
      <p id="clear-status" class="hint" hidden></p>
    </div>
  </section>

  <section id="downloads" class="panel" hidden aria-label="Downloads">
    <header class="settings-header">
      <button id="downloads-close" class="icon" title="Back">&#xE72B;</button>
      <h2>Downloads</h2>
      <span class="spacer"></span>
      <button id="dl-open-folder" class="icon" title="Open the downloads folder">&#xE838;</button>
    </header>
    <div id="dl-list" class="dl-list"></div>
    <p id="dl-empty" class="hint" hidden>Files you download appear here.</p>
    <div class="setting-group">
      <button class="toggle-row" id="dl-ask">
        <span>Ask where to save each file</span>
        <span class="switch" aria-hidden="true"></span>
      </button>
      <p class="hint" id="dl-folder"></p>
      <button id="dl-clear" class="secondary">Clear list</button>
    </div>
  </section>

  <script src="servo:sidebar/sidebar.js"></script>
  <script src="servo:sidebar/session.js"></script>
  <script src="servo:sidebar/suggestions.js"></script>
  <script src="servo:sidebar/history.js"></script>
  <script src="servo:sidebar/downloads.js"></script>
  <script src="servo:sidebar/media.js"></script>
</body>
</html>
