<!doctype html><html><head><meta charset=utf-8><title>known: textarea stretch as grid/flex item</title>
<style>html,body{margin:0}textarea{font:16px/20px Arial;margin:0;resize:none}</style></head><body>
<div data-id="0" style="display:grid;height:84px;width:600px"><textarea data-id="1" style="box-sizing:border-box;padding:0;border:0"></textarea></div>
<div data-id="2" style="display:grid;height:84px;width:600px"><textarea data-id="3" style="box-sizing:border-box;padding:16px;border:0"></textarea></div>
<div data-id="4" style="display:flex;height:84px;width:600px"><textarea data-id="5" style="box-sizing:border-box;padding:0;border:0;width:200px"></textarea></div>
<div data-id="6" style="display:flex;flex-direction:column;height:84px;width:600px"><textarea data-id="7" style="box-sizing:border-box;padding:0;border:0;height:40px"></textarea></div>
</body></html>
